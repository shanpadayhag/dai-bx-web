<button
  #triggerEl
  cdkOverlayOrigin
  #origin="cdkOverlayOrigin"
  type="button"
  (click)="toggle()"
  [attr.aria-expanded]="open()"
  class="flex h-9 w-full items-center justify-between gap-2 rounded-md border-2 border-border bg-secondary-background px-3 text-sm font-medium text-foreground shadow-brutal-sm cursor-pointer transition-shadow hover:shadow-brutal"
>
  <span class="truncate text-left">{{ selectedLabel() }}</span>
  <lucide-icon
    name="chevron-down"
    class="h-4 w-4 shrink-0 transition-transform"
    [class.rotate-180]="open()"
  />
</button>

<ng-template
  cdkConnectedOverlay
  [cdkConnectedOverlayOrigin]="origin"
  [cdkConnectedOverlayOpen]="open()"
  [cdkConnectedOverlayPositions]="positions"
  [cdkConnectedOverlayHasBackdrop]="true"
  [cdkConnectedOverlayFlexibleDimensions]="true"
  [cdkConnectedOverlayPush]="true"
  [cdkConnectedOverlayGrowAfterOpen]="true"
  [cdkConnectedOverlayViewportMargin]="8"
  cdkConnectedOverlayBackdropClass="cdk-overlay-transparent-backdrop"
  (backdropClick)="open.set(false)"
  (detach)="open.set(false)"
  (overlayKeydown)="onMenuKeydown($event)"
>
  <div
    [style.width.px]="triggerWidth()"
    class="max-h-[inherit] overflow-y-auto rounded-md border-2 border-border bg-background shadow-brutal"
    role="listbox"
  >
    @for (option of options(); track option.value) {
      <button
        type="button"
        role="option"
        [attr.aria-selected]="value() === option.value"
        (click)="select(option.value)"
        class="flex w-full items-center justify-between gap-2 px-3 py-2 text-left text-sm font-semibold tracking-tight hover:bg-secondary-background transition-colors"
        [class.bg-primary-soft]="value() === option.value"
      >
        <span class="truncate">{{ option.label }}</span>
        @if (value() === option.value) {
          <lucide-icon name="check" class="h-4 w-4 shrink-0" />
        }
      </button>
    }
  </div>
</ng-template>
