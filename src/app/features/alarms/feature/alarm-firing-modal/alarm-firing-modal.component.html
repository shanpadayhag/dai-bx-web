@if (firing(); as f) {
  <div
    class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 p-4"
    role="dialog"
    aria-modal="true"
    aria-labelledby="alarm-firing-title"
  >
    <div
      class="w-full max-w-md rounded-md border-2 border-border bg-background shadow-brutal p-6 space-y-5"
    >
      <div class="flex items-center gap-4">
        <span
          class="inline-flex h-14 w-14 shrink-0 items-center justify-center rounded-full bg-warning text-warning-foreground border-2 border-border shadow-brutal"
        >
          <lucide-icon name="bell-ring" class="h-7 w-7 animate-pulse" />
        </span>
        <div class="flex-1 min-w-0">
          <p class="text-[0.6875rem] font-bold uppercase tracking-[0.1em] text-subtle-foreground">
            Alarm fired
          </p>
          @if (firingTime()) {
            <p class="readout text-2xl font-bold leading-none mt-1">{{ firingTime() }}</p>
          }
        </div>
      </div>

      <h2 id="alarm-firing-title" class="text-xl font-bold tracking-tight break-words leading-snug">
        {{ f.task.name }}
      </h2>

      <div class="flex gap-2">
        <button
          appButton
          variant="success"
          size="lg"
          btnClass="flex-1"
          (click)="onDone()"
          type="button"
        >
          <lucide-icon name="check" class="h-5 w-5" />
          Done
        </button>
        <button
          appButton
          variant="neutral"
          size="lg"
          btnClass="flex-1"
          (click)="onDismiss()"
          type="button"
        >
          <lucide-icon name="x" class="h-5 w-5" />
          Dismiss
        </button>
      </div>
    </div>
  </div>
}
