<div class="flex items-stretch justify-center gap-2 select-none">
  <div class="flex flex-col items-center gap-1">
    <button
      type="button"
      tabindex="-1"
      (click)="adjustHour(1)"
      class="inline-flex h-8 w-20 items-center justify-center rounded-md border-2 border-transparent text-foreground hover:border-border hover:bg-secondary-background transition-colors cursor-pointer"
      aria-label="Increase hour"
    >
      <lucide-icon name="chevron-up" class="h-4 w-4" />
    </button>
    <input
      #hourInput
      type="text"
      inputmode="numeric"
      maxlength="2"
      [attr.value]="hourDisplay()"
      (input)="onHourInput($event)"
      (focus)="onSegmentFocus($event)"
      (blur)="onSegmentBlur($event, 'hour')"
      (keydown.arrowup)="adjustHour(1); $event.preventDefault()"
      (keydown.arrowdown)="adjustHour(-1); $event.preventDefault()"
      (keydown.space)="toggleMeridiem(); $event.preventDefault()"
      class="readout h-20 w-20 rounded-md border-2 border-border bg-secondary-background text-center text-5xl font-bold tracking-tight shadow-brutal-sm transition-shadow focus-visible:shadow-brutal"
      aria-label="Hour"
    />
    <button
      type="button"
      tabindex="-1"
      (click)="adjustHour(-1)"
      class="inline-flex h-8 w-20 items-center justify-center rounded-md border-2 border-transparent text-foreground hover:border-border hover:bg-secondary-background transition-colors cursor-pointer"
      aria-label="Decrease hour"
    >
      <lucide-icon name="chevron-down" class="h-4 w-4" />
    </button>
  </div>

  <div class="flex flex-col items-center gap-1" aria-hidden="true">
    <div class="h-8"></div>
    <div class="readout flex h-20 items-center justify-center text-5xl font-black text-foreground">
      :
    </div>
    <div class="h-8"></div>
  </div>

  <div class="flex flex-col items-center gap-1">
    <button
      type="button"
      tabindex="-1"
      (click)="adjustMinute(1)"
      class="inline-flex h-8 w-20 items-center justify-center rounded-md border-2 border-transparent text-foreground hover:border-border hover:bg-secondary-background transition-colors cursor-pointer"
      aria-label="Increase minute"
    >
      <lucide-icon name="chevron-up" class="h-4 w-4" />
    </button>
    <input
      #minuteInput
      type="text"
      inputmode="numeric"
      maxlength="2"
      [attr.value]="minuteDisplay()"
      (input)="onMinuteInput($event)"
      (focus)="onSegmentFocus($event)"
      (blur)="onSegmentBlur($event, 'minute')"
      (keydown.arrowup)="adjustMinute(1); $event.preventDefault()"
      (keydown.arrowdown)="adjustMinute(-1); $event.preventDefault()"
      (keydown.space)="toggleMeridiem(); $event.preventDefault()"
      class="readout h-20 w-20 rounded-md border-2 border-border bg-secondary-background text-center text-5xl font-bold tracking-tight shadow-brutal-sm transition-shadow focus-visible:shadow-brutal"
      aria-label="Minute"
    />
    <button
      type="button"
      tabindex="-1"
      (click)="adjustMinute(-1)"
      class="inline-flex h-8 w-20 items-center justify-center rounded-md border-2 border-transparent text-foreground hover:border-border hover:bg-secondary-background transition-colors cursor-pointer"
      aria-label="Decrease minute"
    >
      <lucide-icon name="chevron-down" class="h-4 w-4" />
    </button>
  </div>

  <div class="flex flex-col items-center gap-1">
    <div class="h-8" aria-hidden="true"></div>
    <div
      class="flex h-20 w-14 flex-col overflow-hidden rounded-md border-2 border-border shadow-brutal-sm"
      role="group"
      aria-label="AM or PM"
    >
      <button
        type="button"
        [class]="amSegmentClass()"
        (click)="setMeridiem('am')"
        (keydown.space)="toggleMeridiem(); $event.preventDefault()"
        [attr.aria-pressed]="!isPm()"
      >
        AM
      </button>
      <button
        type="button"
        [class]="pmSegmentClass()"
        (click)="setMeridiem('pm')"
        (keydown.space)="toggleMeridiem(); $event.preventDefault()"
        [attr.aria-pressed]="isPm()"
      >
        PM
      </button>
    </div>
    <div class="h-8" aria-hidden="true"></div>
  </div>
</div>
