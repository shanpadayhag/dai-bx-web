<div
  role="dialog"
  aria-modal="true"
  aria-label="Set alarm"
  class="rounded-md border-2 border-border bg-background shadow-brutal p-3 space-y-3 w-72 max-h-[calc(100vh-2rem)] max-w-[calc(100vw-2rem)] overflow-y-auto"
  (click)="$event.stopPropagation()"
>
  <div class="flex items-center justify-between">
    <span class="text-xs font-bold tracking-tight uppercase text-subtle-foreground">Set alarm</span>
    @if (alarm()) {
      <button
        appButton
        variant="ghost"
        size="icon-sm"
        btnClass="h-7 w-7 text-destructive"
        (click)="onClear()"
        title="Clear alarm"
        type="button"
      >
        <lucide-icon name="bell-off" class="h-4 w-4" />
      </button>
    }
  </div>

  <app-time-spinner [value]="currentTime()" (valueChange)="onTimeChange($event)" />

  <p class="text-center text-xs font-semibold tracking-tight text-subtle-foreground">
    {{ previewLabel() }}
    <span class="ml-1 opacity-60">· space to flip AM/PM</span>
  </p>

  <div class="space-y-1">
    <label class="text-xs font-bold uppercase tracking-wider text-subtle-foreground block">
      Sound
    </label>
    <app-dropdown
      [options]="soundOptions()"
      [value]="currentSoundId()"
      (valueChange)="onSoundChange($event)"
    />
  </div>

  <a
    routerLink="/settings"
    (click)="onManage()"
    class="block text-xs font-semibold text-muted-foreground hover:text-foreground transition-colors"
  >
    Manage sounds →
  </a>

  <div class="flex justify-end">
    <button appButton size="sm" btnClass="h-9 px-4" (click)="onDone()" type="button">Done</button>
  </div>
</div>
