<div
  role="dialog"
  aria-modal="true"
  aria-label="Set alarm"
  class="rounded-md border-2 border-border bg-background shadow-brutal p-4 space-y-4 w-96 max-h-[calc(100vh-2rem)] max-w-[calc(100vw-2rem)] overflow-y-auto"
  (click)="$event.stopPropagation()"
  (keyup)="$event.stopPropagation()"
>
  <div class="flex items-center justify-between">
    <span class="text-xs font-bold tracking-[0.1em] uppercase text-foreground">Set alarm</span>
    @if (alarm()) {
      <button
        appButton
        variant="ghost"
        size="icon-sm"
        btnClass="h-7 w-7 text-destructive"
        (click)="onClear()"
        title="Clear alarm"
        aria-label="Clear alarm"
        type="button"
      >
        <lucide-icon name="bell-off" class="h-4 w-4" />
      </button>
    }
  </div>

  <app-time-spinner [value]="currentTime()" (valueChange)="onTimeChange($event)" />

  <div
    class="flex items-center gap-3 rounded-md border-2 border-border bg-secondary-background px-3 py-2 shadow-brutal-sm"
  >
    <span class="text-[0.6875rem] font-bold uppercase tracking-[0.1em] text-subtle-foreground">
      Fires
    </span>
    <span class="readout text-sm font-bold flex-1">{{ previewTime() }}</span>
    <span class="text-[0.6875rem] font-bold uppercase tracking-[0.1em] text-subtle-foreground">
      {{ previewDay() }}
    </span>
  </div>

  @if (hasAlarm()) {
    <label
      class="flex items-center gap-3 rounded-md border-2 border-border bg-secondary-background px-3 py-2 shadow-brutal-sm cursor-pointer select-none"
    >
      <input
        type="checkbox"
        class="h-4 w-4 accent-foreground"
        [checked]="currentEnabled()"
        (change)="onEnabledChange($any($event.target).checked)"
      />
      <span class="flex-1 text-sm font-bold tracking-tight">Enabled</span>
      <span class="text-[0.6875rem] font-bold uppercase tracking-[0.1em] text-subtle-foreground">
        {{ currentEnabled() ? 'On' : 'Off' }}
      </span>
    </label>
  }

  <div class="space-y-1.5">
    <span
      class="block text-[0.6875rem] font-bold uppercase tracking-[0.1em] text-subtle-foreground"
    >
      Repeat
    </span>
    <div class="grid grid-cols-2 gap-2">
      <button
        type="button"
        [class]="
          'inline-flex items-center justify-center h-9 px-3 rounded-md border-2 border-border text-xs font-bold tracking-tight transition-colors ' +
          (currentRepeat() === 'none'
            ? 'bg-foreground text-secondary-background'
            : 'bg-secondary-background text-foreground hover:bg-foreground/5')
        "
        (click)="onRepeatChange('none')"
      >
        One-shot
      </button>
      <button
        type="button"
        [class]="
          'inline-flex items-center justify-center h-9 px-3 rounded-md border-2 border-border text-xs font-bold tracking-tight transition-colors ' +
          (currentRepeat() === 'daily'
            ? 'bg-foreground text-secondary-background'
            : 'bg-secondary-background text-foreground hover:bg-foreground/5')
        "
        (click)="onRepeatChange('daily')"
      >
        Daily
      </button>
    </div>
  </div>

  <div class="space-y-1.5">
    <span
      class="block text-[0.6875rem] font-bold uppercase tracking-[0.1em] text-subtle-foreground"
    >
      Sound
    </span>
    <app-dropdown
      [options]="soundOptions()"
      [value]="currentSoundId()"
      (valueChange)="onSoundChange($event)"
    />
  </div>

  <a
    routerLink="/settings"
    (click)="onManage()"
    class="block text-xs font-semibold text-muted-foreground hover:text-foreground transition-colors"
  >
    Manage sounds →
  </a>

  <div class="flex justify-end">
    <button appButton size="sm" btnClass="h-9 px-5" (click)="onDone()" type="button">Done</button>
  </div>
</div>
