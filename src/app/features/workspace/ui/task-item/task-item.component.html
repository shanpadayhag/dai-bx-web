@if (visible()) {
  <div [class]="rowClass()" (mouseenter)="hovered.set(true)" (mouseleave)="hovered.set(false)">
    <span
      cdkDragHandle
      class="cursor-grab active:cursor-grabbing text-subtle-foreground hover:text-foreground transition-colors"
      aria-label="Drag to reorder"
    >
      <lucide-icon name="grip-vertical" class="h-4 w-4" />
    </span>

    @if (hasSubtasks()) {
      <button
        appButton
        variant="ghost"
        size="icon-sm"
        btnClass="h-7 w-7"
        (click)="toggleOpen()"
        [attr.aria-expanded]="task().isOpen"
        type="button"
      >
        <lucide-icon name="chevron-down" [class]="chevronClass()" />
      </button>
    } @else {
      <span class="w-7 flex items-center justify-center" aria-hidden="true">
        <span class="block h-1.5 w-1.5 rounded-full bg-foreground/30"></span>
      </span>
    }

    <span [class]="nameClass()">{{ task().name }}</span>

    @if (task().alarm; as alarm) {
      <button
        type="button"
        class="cursor-pointer"
        (click)="toggleAlarmPicker()"
        title="Change alarm"
      >
        <app-alarm-badge [alarm]="alarm" />
      </button>
    }

    <div [class]="actionsClass()">
      <button
        #alarmTrigger="cdkOverlayOrigin"
        cdkOverlayOrigin
        appButton
        [variant]="task().alarm ? 'warning' : 'neutral'"
        size="icon-sm"
        (click)="toggleAlarmPicker()"
        [title]="task().alarm ? 'Change alarm' : 'Set alarm'"
        type="button"
      >
        <lucide-icon [name]="task().alarm ? 'bell-ring' : 'bell'" class="h-4 w-4" />
      </button>
      @if (isCompleted()) {
        <button
          appButton
          variant="warning"
          size="icon-sm"
          (click)="toggleCompletion()"
          title="Undo completion"
          type="button"
        >
          <lucide-icon name="undo-2" class="h-4 w-4" />
        </button>
      } @else {
        <button
          appButton
          variant="success"
          size="icon-sm"
          (click)="toggleCompletion()"
          title="Mark as done"
          type="button"
        >
          <lucide-icon name="check" class="h-4 w-4" />
        </button>
      }
      <button
        appButton
        variant="neutral"
        size="icon-sm"
        (click)="toggleAdding()"
        title="Add subtask"
        type="button"
      >
        <lucide-icon name="plus" class="h-4 w-4" />
      </button>
      <button
        appButton
        variant="destructive"
        size="icon-sm"
        (click)="deleteTask()"
        title="Delete task"
        type="button"
      >
        <lucide-icon name="trash-2" class="h-4 w-4" />
      </button>
    </div>
  </div>

  <ng-template
    cdkConnectedOverlay
    [cdkConnectedOverlayOrigin]="alarmTrigger"
    [cdkConnectedOverlayOpen]="pickingAlarm()"
    [cdkConnectedOverlayPositions]="alarmOverlayPositions"
    [cdkConnectedOverlayHasBackdrop]="true"
    cdkConnectedOverlayBackdropClass="cdk-overlay-transparent-backdrop"
    (backdropClick)="onAlarmPickerClose()"
    (detach)="onAlarmPickerClose()"
    (overlayKeydown)="onAlarmOverlayKeydown($event)"
  >
    <app-alarm-picker
      [alarm]="task().alarm"
      (alarmChange)="onAlarmChange($event)"
      (close)="onAlarmPickerClose()"
    />
  </ng-template>

  @if (adding()) {
    <form (submit)="submitSubtask($event)" class="flex gap-2 mt-2 ml-10 mr-2 mb-2">
      <input
        appInput
        appAutofocus
        [ngModel]="newSubtaskName()"
        (ngModelChange)="newSubtaskName.set($event)"
        name="subtaskName"
        placeholder="Subtask name…"
        class="h-9 text-sm"
        (blur)="onSubtaskBlur()"
      />
      <button appButton size="sm" btnClass="h-9 px-4" type="submit">Add</button>
    </form>
  }

  @if (task().isOpen && hasSubtasks()) {
    <div class="ml-7 mt-1 border-l-2 border-border pl-3">
      <div cdkDropList (cdkDropListDropped)="onChildrenDrop($event)">
        @for (child of sortedChildren(); track child.id) {
          <div cdkDrag>
            <app-task-item [task]="child" [groupId]="groupId()" />
          </div>
        }
      </div>
    </div>
  }
}
