@if (visible()) {
  <div [class]="rowClass()" (mouseenter)="hovered.set(true)" (mouseleave)="hovered.set(false)">
    <span cdkDragHandle [class]="dragHandleClass()" aria-label="Drag to reorder">
      <lucide-icon name="grip-vertical" class="h-4 w-4" />
    </span>

    <button
      type="button"
      (click)="toggleCompletion()"
      [attr.aria-pressed]="isCompleted()"
      [attr.aria-label]="
        isCompleted() ? 'Mark ' + task().name + ' incomplete' : 'Mark ' + task().name + ' complete'
      "
      [class]="completionCircleClass()"
    >
      @if (isCompleted()) {
        <lucide-icon name="check" class="h-3.5 w-3.5 text-secondary-background" />
      }
    </button>

    @if (hasSubtasks()) {
      <button
        appButton
        variant="ghost"
        size="icon-sm"
        btnClass="h-7 w-7"
        (click)="toggleOpen()"
        [attr.aria-expanded]="task().isOpen"
        [attr.aria-label]="task().isOpen ? 'Collapse subtasks' : 'Expand subtasks'"
        type="button"
      >
        <lucide-icon name="chevron-down" [class]="chevronClass()" />
      </button>
    }

    <span [class]="nameClass()">{{ task().name }}</span>

    @if (task().alarm; as alarm) {
      <button
        type="button"
        class="cursor-pointer"
        (click)="toggleAlarmPicker()"
        title="Change alarm"
      >
        <app-alarm-badge [alarm]="alarm" />
      </button>
    }

    @if (activeTimerSet(); as timerSet) {
      <button type="button" class="cursor-pointer" (click)="toggleTimerPicker()" title="Edit timer">
        <app-timer-badge [set]="timerSet" [active]="isTimerActive()" />
      </button>
    }

    <div [class]="actionsClass()">
      <button
        #addToggle
        appButton
        variant="neutral"
        size="icon-sm"
        (click)="toggleAdding()"
        [attr.aria-expanded]="adding()"
        title="Add subtask"
        aria-label="Add subtask"
        type="button"
      >
        <lucide-icon name="plus" class="h-4 w-4" />
      </button>
      <button
        appButton
        variant="destructive"
        size="icon-sm"
        (click)="deleteTask()"
        title="Delete task"
        aria-label="Delete task"
        type="button"
      >
        <lucide-icon name="trash-2" class="h-4 w-4" />
      </button>
      <button
        #menuTrigger="cdkOverlayOrigin"
        cdkOverlayOrigin
        appButton
        variant="neutral"
        size="icon-sm"
        (click)="toggleActions()"
        [attr.aria-expanded]="pickingActions()"
        aria-haspopup="menu"
        title="More actions"
        aria-label="More actions"
        type="button"
      >
        <lucide-icon name="more-vertical" class="h-4 w-4" />
      </button>
    </div>
  </div>

  <ng-template
    cdkConnectedOverlay
    [cdkConnectedOverlayOrigin]="menuTrigger"
    [cdkConnectedOverlayOpen]="pickingActions()"
    [cdkConnectedOverlayPositions]="actionsMenuPositions"
    [cdkConnectedOverlayHasBackdrop]="true"
    cdkConnectedOverlayBackdropClass="cdk-overlay-transparent-backdrop"
    (backdropClick)="onActionsClose()"
    (detach)="onActionsClose()"
    (overlayKeydown)="onActionsKeydown($event)"
  >
    <div
      class="min-w-44 rounded-md border-2 border-border bg-background shadow-brutal overflow-hidden py-1"
      role="menu"
    >
      <button
        type="button"
        role="menuitem"
        class="flex w-full items-center gap-2 px-3 py-2 text-left text-sm font-semibold tracking-tight hover:bg-secondary-background transition-colors cursor-pointer"
        (click)="openAlarmFromMenu()"
      >
        <lucide-icon [name]="alarmMenuIcon()" class="h-4 w-4 shrink-0" />
        <span>{{ alarmMenuLabel() }}</span>
      </button>
      <button
        type="button"
        role="menuitem"
        class="flex w-full items-center gap-2 px-3 py-2 text-left text-sm font-semibold tracking-tight hover:bg-secondary-background transition-colors cursor-pointer"
        (click)="openTimerFromMenu()"
      >
        <lucide-icon name="timer" class="h-4 w-4 shrink-0" />
        <span>{{ timerMenuLabel() }}</span>
      </button>
    </div>
  </ng-template>

  <ng-template #alarmTpl>
    <app-alarm-picker
      [alarm]="task().alarm"
      (alarmChange)="onAlarmChange($event)"
      (closed)="onAlarmPickerClose()"
    />
  </ng-template>

  <ng-template #timerTpl>
    <app-timer-editor
      [groupId]="groupId()"
      [taskId]="task().id"
      [timerSets]="task().timerSets"
      [activeTimerSetId]="task().activeTimerSetId"
      (timerSetsChange)="onTimerSetsChange($event)"
      (activeTimerSetIdChange)="onActiveTimerSetIdChange($event)"
      (closed)="onTimerPickerClose()"
    />
  </ng-template>

  @if (adding()) {
    <form #subtaskForm (submit)="submitSubtask($event)" class="flex gap-2 mt-2 ml-10 mr-2 mb-2">
      <input
        #subtaskInput
        appInput
        appAutofocus
        [ngModel]="newSubtaskName()"
        (ngModelChange)="newSubtaskName.set($event)"
        name="subtaskName"
        placeholder="Subtask name…"
        class="h-9 text-sm"
      />
      <button appButton size="sm" btnClass="h-9 px-4" type="submit">Add</button>
    </form>
  }

  @if (task().isOpen && hasSubtasks()) {
    <div class="ml-7 mt-1 border-l border-subtle-foreground/40 pl-3">
      <div cdkDropList (cdkDropListDropped)="onChildrenDrop($event)">
        @for (child of sortedChildren(); track child.id) {
          <div cdkDrag>
            <app-task-item [task]="child" [groupId]="groupId()" />
          </div>
        }
      </div>
    </div>
  }
}
