@if (visible()) {
  <div [class]="rowClass()" (mouseenter)="hovered.set(true)" (mouseleave)="hovered.set(false)">
    <span
      cdkDragHandle
      class="cursor-grab active:cursor-grabbing text-subtle-foreground hover:text-foreground transition-colors"
      aria-label="Drag to reorder"
    >
      <lucide-icon name="grip-vertical" class="h-4 w-4" />
    </span>

    @if (hasSubtasks()) {
      <button
        appButton
        variant="ghost"
        size="icon-sm"
        btnClass="h-7 w-7"
        (click)="toggleOpen()"
        [attr.aria-expanded]="task().isOpen"
        type="button"
      >
        <lucide-icon name="chevron-down" [class]="chevronClass()" />
      </button>
    } @else {
      <span class="w-7 flex items-center justify-center" aria-hidden="true">
        <span class="block h-1.5 w-1.5 rounded-full bg-foreground/30"></span>
      </span>
    }

    <span [class]="nameClass()">{{ task().name }}</span>

    @if (task().alarm; as alarm) {
      <button
        type="button"
        class="cursor-pointer"
        (click)="toggleAlarmPicker()"
        title="Change alarm"
      >
        <app-alarm-badge [alarm]="alarm" />
      </button>
    }

    @if (activeTimerSet(); as timerSet) {
      <button
        type="button"
        class="cursor-pointer"
        (click)="toggleTimerPicker()"
        title="Edit timer"
      >
        <app-timer-badge [set]="timerSet" />
      </button>
    }

    <div [class]="actionsClass()">
      @if (isCompleted()) {
        <button
          appButton
          variant="warning"
          size="icon-sm"
          (click)="toggleCompletion()"
          title="Undo completion"
          type="button"
        >
          <lucide-icon name="undo-2" class="h-4 w-4" />
        </button>
      } @else {
        <button
          appButton
          variant="success"
          size="icon-sm"
          (click)="toggleCompletion()"
          title="Mark as done"
          type="button"
        >
          <lucide-icon name="check" class="h-4 w-4" />
        </button>
      }
      <button
        #menuTrigger="cdkOverlayOrigin"
        cdkOverlayOrigin
        appButton
        variant="neutral"
        size="icon-sm"
        (click)="toggleActions()"
        [attr.aria-expanded]="pickingActions()"
        aria-haspopup="menu"
        title="More actions"
        type="button"
      >
        <lucide-icon name="more-vertical" class="h-4 w-4" />
      </button>
    </div>
  </div>

  <ng-template
    cdkConnectedOverlay
    [cdkConnectedOverlayOrigin]="menuTrigger"
    [cdkConnectedOverlayOpen]="pickingActions()"
    [cdkConnectedOverlayPositions]="actionsMenuPositions"
    [cdkConnectedOverlayHasBackdrop]="true"
    cdkConnectedOverlayBackdropClass="cdk-overlay-transparent-backdrop"
    (backdropClick)="onActionsClose()"
    (detach)="onActionsClose()"
    (overlayKeydown)="onActionsKeydown($event)"
  >
    <div
      class="min-w-44 rounded-md border-2 border-border bg-background shadow-brutal overflow-hidden py-1"
      role="menu"
    >
      <button
        type="button"
        role="menuitem"
        class="flex w-full items-center gap-2 px-3 py-2 text-left text-sm font-semibold tracking-tight hover:bg-secondary-background transition-colors cursor-pointer"
        (click)="openAlarmFromMenu()"
      >
        <lucide-icon [name]="alarmMenuIcon()" class="h-4 w-4 shrink-0" />
        <span>{{ alarmMenuLabel() }}</span>
      </button>
      <button
        type="button"
        role="menuitem"
        class="flex w-full items-center gap-2 px-3 py-2 text-left text-sm font-semibold tracking-tight hover:bg-secondary-background transition-colors cursor-pointer"
        (click)="openTimerFromMenu()"
      >
        <lucide-icon name="timer" class="h-4 w-4 shrink-0" />
        <span>{{ timerMenuLabel() }}</span>
      </button>
      <button
        type="button"
        role="menuitem"
        class="flex w-full items-center gap-2 px-3 py-2 text-left text-sm font-semibold tracking-tight hover:bg-secondary-background transition-colors cursor-pointer"
        (click)="addSubtaskFromMenu()"
      >
        <lucide-icon name="plus" class="h-4 w-4 shrink-0" />
        <span>Add subtask</span>
      </button>
      <div class="my-1 h-px bg-border" role="separator"></div>
      <button
        type="button"
        role="menuitem"
        class="flex w-full items-center gap-2 px-3 py-2 text-left text-sm font-semibold tracking-tight text-destructive hover:bg-destructive/10 transition-colors cursor-pointer"
        (click)="deleteFromMenu()"
      >
        <lucide-icon name="trash-2" class="h-4 w-4 shrink-0" />
        <span>Delete task</span>
      </button>
    </div>
  </ng-template>

  <ng-template #alarmTpl>
    <app-alarm-picker
      [alarm]="task().alarm"
      (alarmChange)="onAlarmChange($event)"
      (close)="onAlarmPickerClose()"
    />
  </ng-template>

  <ng-template #timerTpl>
    <app-timer-editor
      [groupId]="groupId()"
      [taskId]="task().id"
      [timerSets]="task().timerSets"
      [activeTimerSetId]="task().activeTimerSetId"
      (timerSetsChange)="onTimerSetsChange($event)"
      (activeTimerSetIdChange)="onActiveTimerSetIdChange($event)"
      (close)="onTimerPickerClose()"
    />
  </ng-template>

  @if (adding()) {
    <form (submit)="submitSubtask($event)" class="flex gap-2 mt-2 ml-10 mr-2 mb-2">
      <input
        appInput
        appAutofocus
        [ngModel]="newSubtaskName()"
        (ngModelChange)="newSubtaskName.set($event)"
        name="subtaskName"
        placeholder="Subtask name…"
        class="h-9 text-sm"
        (blur)="onSubtaskBlur()"
      />
      <button appButton size="sm" btnClass="h-9 px-4" type="submit">Add</button>
    </form>
  }

  @if (task().isOpen && hasSubtasks()) {
    <div class="ml-7 mt-1 border-l-2 border-border pl-3">
      <div cdkDropList (cdkDropListDropped)="onChildrenDrop($event)">
        @for (child of sortedChildren(); track child.id) {
          <div cdkDrag>
            <app-task-item [task]="child" [groupId]="groupId()" />
          </div>
        }
      </div>
    </div>
  }
}
