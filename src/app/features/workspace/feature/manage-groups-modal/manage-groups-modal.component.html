<div
  role="dialog"
  aria-modal="true"
  aria-label="Manage visible groups"
  class="rounded-md border-2 border-border bg-background shadow-brutal p-4 space-y-4 w-96 max-h-[calc(100vh-2rem)] max-w-[calc(100vw-2rem)] overflow-hidden flex flex-col"
  (click)="$event.stopPropagation()"
  (keyup)="$event.stopPropagation()"
>
  <div class="flex items-center justify-between">
    <span class="text-xs font-bold tracking-[0.1em] uppercase text-foreground">Visible groups</span>
    @if (hasHidden()) {
      <button
        appButton
        variant="ghost"
        size="sm"
        btnClass="h-8 px-2.5 text-xs"
        (click)="onShowAll()"
        type="button"
      >
        <lucide-icon name="eye" class="h-3.5 w-3.5" />
        Show all
      </button>
    }
  </div>

  @if (hasHidden()) {
    <p class="readout text-xs font-semibold text-muted-foreground -mt-2">
      {{ hiddenCount() }} hidden · {{ groups().length - hiddenCount() }} shown
    </p>
  }

  @if (groups().length === 0) {
    <p class="text-sm font-medium text-muted-foreground py-6 text-center">No groups yet.</p>
  } @else {
    <ul class="flex-1 overflow-y-auto -mx-1 px-1 space-y-1" role="list">
      @for (group of groups(); track group.id) {
        <li>
          <label
            [for]="'mgm-group-' + group.id"
            class="flex items-center gap-3 px-3 py-2.5 rounded-md border-2 border-transparent hover:border-border hover:bg-secondary-background cursor-pointer transition-colors"
          >
            <input
              [id]="'mgm-group-' + group.id"
              type="checkbox"
              class="h-4 w-4 shrink-0 cursor-pointer"
              [checked]="!group.isHidden"
              (change)="onToggle(group, $any($event.target).checked)"
            />
            <span
              class="flex-1 text-sm font-semibold tracking-tight truncate"
              [class.text-subtle-foreground]="group.isHidden"
              [class.line-through]="group.isHidden"
            >
              {{ group.name }}
            </span>
          </label>
        </li>
      }
    </ul>
  }

  <div class="flex justify-end pt-1">
    <button appButton size="sm" btnClass="h-9 px-5" (click)="onDone()" type="button">Done</button>
  </div>
</div>
