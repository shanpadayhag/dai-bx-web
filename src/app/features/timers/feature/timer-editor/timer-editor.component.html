<div
  role="dialog"
  aria-modal="true"
  aria-label="Timer editor"
  class="rounded-md border-2 border-border bg-background shadow-brutal p-3 space-y-3 w-80 max-h-[calc(100vh-2rem)] max-w-[calc(100vw-2rem)] overflow-y-auto"
  (click)="$event.stopPropagation()"
>
  <div class="flex items-center justify-between">
    <span class="text-xs font-bold tracking-tight uppercase text-subtle-foreground">Timer</span>
    @if (currentSet()) {
      <button
        appButton
        variant="ghost"
        size="icon-sm"
        btnClass="h-7 w-7 text-destructive"
        (click)="deleteSet()"
        title="Delete this version"
        type="button"
      >
        <lucide-icon name="trash-2" class="h-4 w-4" />
      </button>
    }
  </div>

  @if (sortedSets().length > 0) {
    <div class="flex flex-wrap gap-1">
      @for (s of sortedSets(); track s.id) {
        <button
          appButton
          [variant]="s.id === currentSet()?.id ? 'default' : 'neutral'"
          size="sm"
          btnClass="h-8 px-2 text-xs"
          (click)="selectSet(s.id)"
          type="button"
        >
          {{ s.name }}
        </button>
      }
      <button
        appButton
        variant="neutral"
        size="icon-sm"
        btnClass="h-8 w-8"
        (click)="addSet()"
        title="Add version"
        type="button"
      >
        <lucide-icon name="plus" class="h-4 w-4" />
      </button>
    </div>
  } @else {
    <button
      appButton
      size="sm"
      btnClass="w-full h-9"
      (click)="addSet()"
      type="button"
    >
      <lucide-icon name="plus" class="h-4 w-4" />
      Add timer version
    </button>
  }

  @if (currentSet(); as set) {
    <div class="space-y-2">
      <input
        appInput
        [ngModel]="set.name"
        (ngModelChange)="renameSet($event)"
        name="setName"
        placeholder="Version name"
        class="h-9 text-sm"
      />

      <label
        class="flex items-center gap-2 text-xs font-bold uppercase tracking-wider text-subtle-foreground cursor-pointer"
      >
        <input
          #autoAdvanceCheckbox
          type="checkbox"
          [checked]="set.autoAdvance"
          (change)="toggleAutoAdvance(autoAdvanceCheckbox.checked)"
          class="h-4 w-4"
        />
        Auto-advance between steps
      </label>

      <div class="space-y-1">
        <label class="text-xs font-bold uppercase tracking-wider text-subtle-foreground block">
          Sound
        </label>
        <app-dropdown
          [options]="soundOptions()"
          [value]="set.soundId ?? ''"
          (valueChange)="updateSetSound($event)"
        />
      </div>
    </div>

    <div class="space-y-1.5">
      @for (step of currentTimers(); track step.id; let i = $index) {
        <div class="flex items-center gap-1.5">
          <span
            class="inline-flex h-9 w-7 items-center justify-center rounded-md border-2 border-border bg-secondary-background text-xs font-bold tabular-nums"
            aria-hidden="true"
          >
            {{ i + 1 }}
          </span>
          <input
            appInput
            type="number"
            min="1"
            max="180"
            [ngModel]="step.durationMinutes"
            (ngModelChange)="updateStepDuration(step.id, +$event)"
            [name]="'duration-' + step.id"
            class="h-9 flex-1 text-sm"
          />
          <span class="text-xs font-bold tracking-tight text-subtle-foreground">min</span>
          <button
            appButton
            variant="ghost"
            size="icon-sm"
            btnClass="h-7 w-7 text-destructive"
            (click)="deleteStep(step.id)"
            title="Remove step"
            type="button"
          >
            <lucide-icon name="x" class="h-4 w-4" />
          </button>
        </div>
      }

      <button
        appButton
        variant="neutral"
        size="sm"
        btnClass="w-full h-9"
        (click)="addStep()"
        type="button"
      >
        <lucide-icon name="plus" class="h-4 w-4" />
        Add step
      </button>
    </div>

    <a
      routerLink="/settings"
      (click)="onManageSounds()"
      class="block text-xs font-semibold text-muted-foreground hover:text-foreground transition-colors"
    >
      Manage sounds →
    </a>

    <div class="flex justify-between gap-2">
      <button
        appButton
        variant="success"
        size="sm"
        btnClass="h-9 px-4 flex-1"
        [disabled]="!canStart()"
        (click)="start()"
        type="button"
      >
        <lucide-icon name="play" class="h-4 w-4" />
        Start
      </button>
      <button
        appButton
        variant="neutral"
        size="sm"
        btnClass="h-9 px-4"
        (click)="onDone()"
        type="button"
      >
        Done
      </button>
    </div>
  }
</div>
