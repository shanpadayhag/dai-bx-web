name: CI

on:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  VERCEL_CLI_VERSION: 65.2.0
  PROD_ORIGIN: https://dai-bx.vercel.app

jobs:
  check:
    name: Format, lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Check action pins
        run: ./scripts/check-action-pins.sh

      - name: Audit dependencies
        run: npm run audit:dependencies

  stage-prod:
    name: Build and stage for dai-bx.vercel.app
    if: startsWith(github.ref, 'refs/tags/v3.')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: prod
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    outputs:
      staged-url: ${{ steps.stage.outputs.url }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install the Vercel CLI
        run: npm install --global vercel@${{ env.VERCEL_CLI_VERSION }}

      - name: Pull the production settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Stage without moving the domain
        id: stage
        run: |
          staged_url=$(vercel deploy --prebuilt --prod --skip-domain --archive=tgz --token=${{ secrets.VERCEL_TOKEN }})
          if [[ -z "$staged_url" ]]; then
            echo "::error title=Stage::vercel deploy printed no URL"
            exit 1
          fi
          echo "::notice title=Staged::$staged_url"
          echo "url=$staged_url" >> "$GITHUB_OUTPUT"

  deploy-prod:
    name: Promote on dai-bx.vercel.app
    needs: [check, audit, stage-prod]
    if: startsWith(github.ref, 'refs/tags/v3.')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: prod
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Promote the staged deployment
        env:
          STAGED_URL: ${{ needs.stage-prod.outputs.staged-url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [[ -z "$STAGED_URL" ]]; then
            echo "::error title=Promote::the staged URL did not reach this job"
            exit 1
          fi
          vercel_api() {
            curl --silent --show-error --fail-with-body -H "Authorization: Bearer $VERCEL_TOKEN" "$@"
          }
          staged_host="${STAGED_URL#https://}"
          if ! staged_deployment=$(vercel_api "https://api.vercel.com/v13/deployments/${staged_host}?teamId=${VERCEL_ORG_ID}"); then
            echo "::error title=Promote::could not read the staged deployment: ${staged_deployment//$'\n'/'%0A'}"
            exit 1
          fi
          staged_deployment_id=$(jq -r .id <<< "$staged_deployment")
          if ! promote_response=$(vercel_api -X POST "https://api.vercel.com/v10/projects/${VERCEL_PROJECT_ID}/promote/${staged_deployment_id}?teamId=${VERCEL_ORG_ID}"); then
            echo "::error title=Promote::${promote_response//$'\n'/'%0A'}"
            exit 1
          fi
          for attempt in $(seq 1 24); do
            live_deployment_id=$(vercel_api "https://api.vercel.com/v13/deployments/${PROD_ORIGIN#https://}?teamId=${VERCEL_ORG_ID}" | jq -r .id || true)
            if [[ "$live_deployment_id" == "$staged_deployment_id" ]]; then
              echo "::notice title=Promoted::$STAGED_URL"
              exit 0
            fi
            sleep 5
          done
          echo "::error title=Promote::${PROD_ORIGIN} still serves ${live_deployment_id}, not ${staged_deployment_id}"
          exit 1

      - name: Check the API through the rewrite
        run: curl --fail --silent --show-error --retry 12 --retry-delay 10 --retry-all-errors "${PROD_ORIGIN}/backend/health"
