name: Deploy prod

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: ['v3.*']

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  VERCEL_CLI_VERSION: 65.2.0
  ALPHA_ORIGIN: https://dai-bx-v3.vercel.app

jobs:
  deploy:
    name: Build and deploy to the v3 alpha address
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && startsWith(github.event.workflow_run.head_branch, 'v3.')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: prod
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install the Vercel CLI
        run: npm install --global vercel@${{ env.VERCEL_CLI_VERSION }}

      - name: Pull the production settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Check the API through the rewrite
        run: curl --fail --silent --show-error --retry 5 --retry-delay 5 "${ALPHA_ORIGIN}/backend/health"
