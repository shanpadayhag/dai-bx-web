name: Deploy prod

on:
  workflow_call:
    secrets:
      VERCEL_ORG_ID:
        required: false
      VERCEL_PROJECT_ID:
        required: false
      VERCEL_TOKEN:
        required: false

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  VERCEL_CLI_VERSION: 65.2.0
  PROD_ORIGIN: https://dai-bx.vercel.app

jobs:
  deploy:
    name: Build and deploy to dai-bx.vercel.app
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: prod
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install the Vercel CLI
        run: npm install --global vercel@${{ env.VERCEL_CLI_VERSION }}

      - name: Pull the production settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        run: vercel deploy --prebuilt --prod --archive=tgz --token=${{ secrets.VERCEL_TOKEN }}

      - name: Check the API through the rewrite
        run: curl --fail --silent --show-error --retry 12 --retry-delay 10 --retry-all-errors "${PROD_ORIGIN}/backend/health"
